[tox]
skipsdist = true
envlist = py312,black-template

[testenv]
deps =
    pytest
    pytest-mock
    pytest-xdist
    pyyaml
    binaryornot
    cookiecutter
    pytest-cookies
    sh
    ruff
    djlint
passenv = AUTOFIXABLE_STYLES
commands = pytest -n auto {posargs:./tests}

[testenv:black-template]
deps = black
commands = black --check hooks tests docs scripts
